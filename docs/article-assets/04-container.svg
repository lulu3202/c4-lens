<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520"><rect width="100%" height="100%" fill="white"/><text x="40" y="28" font-family="Arial" font-size="20" font-weight="bold">C4 Lens — Container</text><rect x="80" y="40" width="360" height="80" rx="10" fill="#084c61"/><text x="100" y="70" fill="white" font-family="Arial" font-size="18">Architecture reviewer</text><text x="100" y="97" fill="white" font-family="Arial" font-size="13">Reviews and approves generated architecture.</text><rect x="80" y="155" width="360" height="80" rx="10" fill="#16697a"/><text x="100" y="185" fill="white" font-family="Arial" font-size="18">C4 Lens</text><text x="100" y="212" fill="white" font-family="Arial" font-size="13">Turns a problem statement into reviewable C4 diagrams.</text><rect x="80" y="270" width="360" height="80" rx="10" fill="#16697a"/><text x="100" y="300" fill="white" font-family="Arial" font-size="18">LLM provider</text><text x="100" y="327" fill="white" font-family="Arial" font-size="13">Proposes a structured architecture model.</text><rect x="80" y="385" width="360" height="80" rx="10" fill="#489fb5"/><text x="100" y="415" fill="white" font-family="Arial" font-size="18">Streamlit application</text><text x="100" y="442" fill="white" font-family="Arial" font-size="13">Collects input, presents review, and exports diagrams.</text></svg>